<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <!-- Bootstrap CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 600px;">
        <!-- Card do Formulário -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h3 class="card-title text-primary mb-3">🛒 Cadastro de Produtos</h3>
                
                <form action="/" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nome do Produto</label>
                        <input type="text" name="nome" class="form-control" placeholder="Ex: Arroz" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Preço (R$)</label>
                        <input type="number" step="0.01" name="preco" class="form-control" placeholder="Ex: 10.50" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Cadastrar Produto</button>
                </form>
            </div>
        </div>

        <!-- Tabela de Produtos -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-3">Itens Cadastrados</h4>

                {% if produtos %}
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Produto</th>
                                    <th class="text-end">Preço</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for item in produtos %}
                                    <tr>
                                        <td>{{ item['nome'] }}</td>
                                        <td class="text-end">R$ {{ "%.2f"|format(item['preco']) }}</td>
                                    </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>

                    <div class="alert alert-success mt-3 mb-0 text-center fw-bold fs-5">
                        Total do Carrinho: R$ {{ "%.2f"|format(total) }}
                    </div>
                {% else %}
                    <p class="text-muted text-center my-3">Nenhum produto cadastrado ainda.</p>
                {% endif %}
            </div>
        </div>
    </div>

</body>
</html>
